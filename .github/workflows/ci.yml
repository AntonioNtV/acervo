name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  # Settings refuses to start without it; the web job's `make openapi` imports the app.
  SESSION_SECRET: ci-session-secret

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      # Not minio-bucket: --wait fails on a container that exits, and the tests create their own bucket.
      - run: docker compose up -d --wait postgres minio
      - run: uv sync --locked
      - run: make lint
      # The layering test and the migration roundtrip are part of the suite; the floor is in pyproject.toml.
      - run: make test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: ./.github/actions/setup-pnpm
      - run: uv sync --locked
      - run: make web-check
      - run: make openapi
      - name: The OpenAPI document and the web client are up to date
        run: git diff --exit-code -- docs/openapi.json web/src/api/schema.gen.ts
