[project]
name = "acervo"
version = "0.1.0"
description = "Knowledge bases of folders, pages and PDFs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "aioboto3",
    "pymupdf",
    "python-multipart",
    "uuid6>=2025.0.1",
    "zipstream-ng>=1.9.3",
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
# Markdown holds skills and docs, not code to format.
extend-exclude = ["*.md"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aioboto3", "botocore.*", "zipstream"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
