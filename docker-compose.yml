name: acervo

x-acervo: &acervo
  build: .
  image: acervo:dev
  # API_KEY and the rest come from .env (copy .env.example); the addresses below are the ones inside compose.
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://acervo:acervo@postgres:5432/acervo
    S3_ENDPOINT: http://minio:9000

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: acervo
      POSTGRES_DB: acervo
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acervo"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:56379:6379"

  # minio/minio is no longer published; Chainguard's build is the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: acervo
      MINIO_ROOT_PASSWORD: acervo-secret
      MC_HOST_local: http://acervo:acervo-secret@localhost:9000
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  minio-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://acervo:acervo-secret@minio:9000
    command: mb --ignore-existing local/acervo
    restart: on-failure

  migrate:
    <<: *acervo
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *acervo
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres:
  minio:
