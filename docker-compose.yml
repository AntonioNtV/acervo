services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: acervo
      POSTGRES_DB: acervo
    ports:
      - "55433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acervo"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "56379:6379"

  # minio/minio is no longer published; Chainguard's build is the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: acervo
      MINIO_ROOT_PASSWORD: acervo-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio:/data

  minio-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on: [minio]
    environment:
      MC_HOST_local: http://acervo:acervo-secret@minio:9000
    command: mb --ignore-existing local/acervo
    restart: on-failure

volumes:
  postgres:
  minio:
