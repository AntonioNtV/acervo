name: acervo

x-acervo: &acervo
  build: .
  image: acervo:dev
  # API_KEY and the rest come from .env (copy .env.example); the addresses below are the ones inside compose.
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://acervo:acervo@postgres:5432/acervo
    S3_ENDPOINT: http://minio:9000
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    TEMPORAL_ADDRESS: temporal:7233

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: acervo
      POSTGRES_PASSWORD: acervo
      POSTGRES_DB: acervo
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acervo"]
      interval: 2s
      retries: 30

  # minio/minio is no longer published; Chainguard's build is the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: acervo
      MINIO_ROOT_PASSWORD: acervo-secret
      MC_HOST_local: http://acervo:acervo-secret@localhost:9000
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  minio-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://acervo:acervo-secret@minio:9000
    command: mb --ignore-existing local/acervo
    restart: on-failure

  # Catches every email sent in development; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Temporal server for the digest schedule, keeping its own databases in the same Postgres.
  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: acervo
      POSTGRES_PWD: acervo
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy once auto-setup has created the default namespace the worker uses.
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "-n", "default", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    <<: *acervo
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *acervo
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *acervo
    command: ["python", "-m", "acervo.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

volumes:
  postgres:
  minio:
